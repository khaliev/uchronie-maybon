<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page.title}} — {{site.name}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="robots" content="index, follow">
  <meta name="author" content="{{site.artisan}}">
  <meta name="theme-color" content="#681D2A">
  <link rel="canonical" href="{{site.url}}{{page.path}}">
  <link rel="icon" type="image/png" href="/assets/images/originals/logo-embleme-sablier-or.png">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:title" content="{{page.title}} — {{site.name}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{site.url}}{{page.path}}">
  <meta property="og:image" content="{{site.og_image}}">
  <meta property="og:locale" content="fr_FR">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{page.title}} — {{site.name}}">
  <meta name="twitter:description" content="{{page.description}}">
  <meta name="twitter:image" content="{{site.og_image}}">
  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/utilities.css">
  <!-- Données structurées : boutique artisanale -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HomeGoodsStore",
    "name": "{{site.name}}",
    "description": "{{site.description}}",
    "url": "{{site.url}}",
    "image": "{{site.og_image}}",
    "telephone": "{{site.phone_tel}}",
    "email": "{{site.email}}",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "68 bis rue Ponsardin",
      "postalCode": "51100",
      "addressLocality": "Reims",
      "addressCountry": "FR"
    },
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "11:00",
        "closes": "18:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": "Saturday",
        "opens": "10:00",
        "closes": "19:00"
      }
    ],
    "sameAs": [
      "{{site.instagram}}",
      "{{site.facebook}}"
    ]
  }
  </script>
  <!-- Scripts ES Module -->
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body>
