# Uchronie Maybon — configuration projet
# Ne pas inventer de donnée métier : placeholders + [[A_VERIFIER:...]] uniquement.

project:
  name: "Uchronie Maybon"
  slug: "uchronie-maybon"
  description: >
    Refonte du site vitrine d'un artisan ébéniste / tabletteur / marqueteur /
    gainier / designer produit. Haut de gamme, artisanal, contemporain avec
    héritage historique.
  status: "scaffolding"            # scaffolding → audit → contenu → build → qa → livraison
  lang: "fr"
  stack: "static"                  # HTML + CSS + JS natif, build Node.js simple
  framework: "none"

sources:
  reminder: >
    Avant toute rédaction, extraction ou implémentation métier, collecter et
    croiser les données depuis les URLs listées dans docs/source-urls.md.
  file: "docs/source-urls.md"

quality:
  lighthouse_performance: 95
  lighthouse_accessibility: 95
  lighthouse_seo: 95
  lighthouse_best_practices: 95
  responsive_min: "320px"
  responsive_max: "4K"
  hamburger_mobile_accessible: true
  full_keyboard_navigation: true
  prefers_reduced_motion: true
  targets_file: "docs/quality-targets.md"

content:
  root: "src/content/"
  pages_dir: "src/content/pages/"
  partials_dir: "src/partials/"
  assets_dir: "src/assets/"

build:
  output_dir: "dist/"
  scripts:
    validate: "scripts/validate-content.mjs"
    build: "scripts/build.mjs"
    check_links: "scripts/check-links.mjs"
    serve: "scripts/serve.mjs"

tasks:
  prefix: "tasks/"
  list:
    - "T00-regles-anti-hallucination.md"
    - "T01-audit-site-existant.md"
    - "T02-recuperation-assets.md"
    - "T03-extraction-contenu.md"
    - "T04-architecture-technique.md"
    - "T05-design-system.md"
    - "T06-build-et-templates.md"
    - "T07-pages.md"
    - "T08-interactions-js.md"
    - "T09-reservation.md"
    - "T10-seo-geo.md"
    - "T11-qa-accessibilite-perf.md"
    - "T12-livraison.md"

docs:
  state: "docs/state.json"
  decisions: "docs/decisions.md"
  client_todo: "docs/TODO-CLIENT.md"
  brief: "docs/brief-client.md"

